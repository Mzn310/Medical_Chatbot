<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
      :root {
        --bg: #eef3f1;
        --surface: #ffffff;
        --ink: #14262a;
        --muted: #5c7a75;
        --teal: #0b6e64;
        --teal-deep: #084f49;
        --pulse: #e63946;
        --line: #d7e2df;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 28px 28px;
        background-position: center;
        font-family: "IBM Plex Sans", sans-serif;
        color: var(--ink);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .chat-app {
        width: 100%;
        max-width: 460px;
        height: min(680px, 92vh);
        background: var(--surface);
        border-radius: 18px;
        box-shadow:
          0 24px 60px -20px rgba(8, 79, 73, 0.35),
          0 2px 8px rgba(8, 79, 73, 0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ---------- Header ---------- */
      .chat-header {
        position: relative;
        background: linear-gradient(135deg, var(--teal-deep), var(--teal));
        color: #eaf5f3;
        padding: 18px 20px 14px;
        flex-shrink: 0;
        overflow: hidden;
      }

      .chat-header-top {
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        z-index: 2;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--pulse);
        box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.6);
        animation: dot-pulse 1.8s ease-in-out infinite;
        flex-shrink: 0;
      }

      @keyframes dot-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.55);
        }
        70% {
          box-shadow: 0 0 0 8px rgba(230, 57, 70, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(230, 57, 70, 0);
        }
      }

      .chat-title {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 1.05rem;
        letter-spacing: 0.01em;
        line-height: 1.2;
      }

      .chat-subtitle {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #bfe0da;
        margin-top: 2px;
      }

      /* EKG trace strip */
      .ekg-strip {
        margin-top: 12px;
        height: 34px;
        position: relative;
        overflow: hidden;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        padding-top: 6px;
      }

      .ekg-track {
        display: flex;
        width: 200%;
        animation: ekg-scroll 6s linear infinite;
      }
      .ekg-track.burst {
        animation-duration: 1.4s;
      }

      .ekg-track svg {
        flex-shrink: 0;
        width: 50%;
        height: 28px;
      }

      @keyframes ekg-scroll {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      /* ---------- Messages ---------- */
      .chat-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: radial-gradient(
          circle at top right,
          rgba(11, 110, 100, 0.05),
          transparent 55%
        );
      }

      .chat-body::-webkit-scrollbar {
        width: 8px;
      }
      .chat-body::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 8px;
      }

      .msg-row {
        display: flex;
        gap: 8px;
        max-width: 85%;
        align-items: flex-end;
      }
      .msg-row.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }
      .msg-row.bot {
        align-self: flex-start;
      }

      .avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
      }
      .avatar.bot {
        background: var(--teal);
        color: #fff;
      }
      .avatar.user {
        background: #dde9e7;
        color: var(--teal-deep);
      }

      .bubble {
        padding: 10px 13px;
        border-radius: 14px;
        font-size: 0.9rem;
        line-height: 1.45;
        position: relative;
      }
      .bot .bubble {
        background: var(--surface);
        border: 1px solid var(--line);
        border-bottom-left-radius: 4px;
        color: var(--ink);
      }
      .user .bubble {
        background: var(--teal);
        color: #eaf5f3;
        border-bottom-right-radius: 4px;
      }

      .msg-time {
        display: block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.62rem;
        color: var(--muted);
        margin-top: 4px;
        letter-spacing: 0.03em;
      }
      .user .msg-time {
        color: #bfe0da;
        text-align: right;
      }

      /* ---------- Footer / input ---------- */
      .chat-footer {
        border-top: 1px solid var(--line);
        padding: 12px 14px;
        flex-shrink: 0;
        background: var(--surface);
      }

      #messageArea {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .type_msg {
        flex: 1;
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: 22px;
        padding: 11px 16px;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 0.88rem;
        color: var(--ink);
        outline: none;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .type_msg::placeholder {
        color: var(--muted);
      }
      .type_msg:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(11, 110, 100, 0.12);
      }
      .type_msg:focus-visible {
        outline: 2px solid var(--teal);
        outline-offset: 2px;
      }

      .send_btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: none;
        background: var(--pulse);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          transform 0.12s ease,
          background 0.15s ease;
      }
      .send_btn:hover {
        background: #cf313d;
      }
      .send_btn:active {
        transform: scale(0.92);
      }
      .send_btn:focus-visible {
        outline: 2px solid var(--teal-deep);
        outline-offset: 2px;
      }
      .send_btn svg {
        width: 17px;
        height: 17px;
      }

      @media (max-width: 500px) {
        body {
          padding: 0;
        }
        .chat-app {
          height: 100vh;
          max-width: 100%;
          border-radius: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ekg-track {
          animation: none;
        }
        .status-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-app">
      <div class="chat-header">
        <div class="chat-header-top">
          <span class="status-dot" aria-hidden="true"></span>
          <div>
            <div class="chat-title">Medical Chatbot</div>
            <div class="chat-subtitle">Ask me anything · Online</div>
          </div>
        </div>
        <div class="ekg-strip" aria-hidden="true">
          <div class="ekg-track" id="ekgTrack">
            <svg viewBox="0 0 300 28" preserveAspectRatio="none">
              <polyline
                fill="none"
                stroke="#E63946"
                stroke-width="1.6"
                stroke-linejoin="round"
                stroke-linecap="round"
                points="0,14 30,14 40,14 48,4 56,24 64,8 72,14 110,14 120,14 128,4 136,24 144,8 152,14 190,14 200,14 208,4 216,24 224,8 232,14 270,14 300,14"
              />
            </svg>
            <svg viewBox="0 0 300 28" preserveAspectRatio="none">
              <polyline
                fill="none"
                stroke="#E63946"
                stroke-width="1.6"
                stroke-linejoin="round"
                stroke-linecap="round"
                points="0,14 30,14 40,14 48,4 56,24 64,8 72,14 110,14 120,14 128,4 136,24 144,8 152,14 190,14 200,14 208,4 216,24 224,8 232,14 270,14 300,14"
              />
            </svg>
          </div>
        </div>
      </div>

      <div id="messageFormeight" class="chat-body"></div>

      <div class="chat-footer">
        <form id="messageArea" autocomplete="off">
          <input
            type="text"
            id="text"
            name="msg"
            placeholder="Describe your symptoms..."
            class="type_msg"
            required
          />
          <button
            type="submit"
            id="send"
            class="send_btn"
            aria-label="Send message"
          >
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M3 12L21 4L14 21L11 13L3 12Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </form>
      </div>
    </div>

    <script>
      function timeNow() {
        const d = new Date();
        const h = d.getHours().toString().padStart(2, "0");
        const m = d.getMinutes().toString().padStart(2, "0");
        return h + ":" + m;
      }

      function burstEkg() {
        const track = document.getElementById("ekgTrack");
        track.classList.add("burst");
        setTimeout(() => track.classList.remove("burst"), 1400);
      }

      $(document).ready(function () {
        $("#messageArea").on("submit", function (event) {
          event.preventDefault();
          const rawText = $("#text").val();
          if (!rawText.trim()) return;
          const str_time = timeNow();

          const userHtml = `
        <div class="msg-row user">
          <div class="avatar user">You</div>
          <div class="bubble">${rawText}<span class="msg-time">${str_time}</span></div>
        </div>`;

          $("#text").val("");
          $("#messageFormeight").append(userHtml);
          $("#messageFormeight").scrollTop(
            $("#messageFormeight")[0].scrollHeight,
          );
          burstEkg();

          $.ajax({
            data: { msg: rawText },
            type: "POST",
            url: "/get",
          }).done(function (data) {
            const botHtml = `
          <div class="msg-row bot">
            <div class="avatar bot">Dr</div>
            <div class="bubble">${data}<span class="msg-time">${timeNow()}</span></div>
          </div>`;
            $("#messageFormeight").append($.parseHTML(botHtml));
            $("#messageFormeight").scrollTop(
              $("#messageFormeight")[0].scrollHeight,
            );
            burstEkg();
          });
        });
      });
    </script>
  </body>
</html>
